<div class="w-full flex justify-center py-4">

<div class="relative flex justify-center items-center h-48 overflow-hidden mb-8">

<div class="absolute inset-x-0 h-16 border-y border-outline-variant pointer-events-none"></div>
<div class="flex items-center gap-8 px-4 w-full justify-center">

<span class="text-primary font-bold">10</span>

</div>

<span class="opacity-20">32</span>
<span class="text-primary font-bold">33</span>
<span class="opacity-20">34</span>
</div>

<span class="text-primary font-bold">AM</span>
<span class="opacity-20">PM</span>
</div>
</div>
</div>

</button>

<span class="font-label-sm text-on-surface-variant">Fri, 20 Oct</span>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-high active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>

<div class="text-center mb-8">
<button class="text-secondary font-label-lg underline underline-offset-4 hover:text-primary transition-colors">
                        Reset to current time
                    </button>
</div>

                    </button>
